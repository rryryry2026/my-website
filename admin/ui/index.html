<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>晚巷 · 内容管理</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="#/posts">
          <span class="brand-flower" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
              <path d="M12 21V11m0 0c-2.6 0-4.8-1.7-4.8-4.2C7.2 4.2 9.4 3 12 5.2 14.6 3 16.8 4.2 16.8 6.8c0 2.5-2.2 4.2-4.8 4.2Z" />
              <path d="M12 11c-3 0-5.4 1.3-6.4 3.6M12 11c3 0 5.4 1.3 6.4 3.6" />
            </svg>
          </span>
          <span>
            <strong>晚巷</strong>
            <small>CONTENT STUDIO</small>
          </span>
        </a>

        <nav class="nav">
          <a href="#/posts" data-nav="posts"><span class="nav-icon">文</span>文章</a>
          <a href="#/media" data-nav="media"><span class="nav-icon">图</span>图片</a>
          <a href="#/site" data-nav="site"><span class="nav-icon">字</span>站点文案</a>
          <a href="#/photos" data-nav="photos"><span class="nav-icon">册</span>相册</a>
          <a href="#/tags" data-nav="tags"><span class="nav-icon">签</span>标签</a>
        </nav>

        <div class="sidebar-foot">
          <a class="side-link" id="preview-link" href="http://localhost:4321/" target="_blank" rel="noreferrer">
            打开网站 <span aria-hidden="true">↗</span>
          </a>
          <button class="btn ghost small" id="build-btn" type="button">构建站点</button>
          <p class="side-note">仅本机运行 · 数据直接写入项目文件</p>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="crumb" id="crumb">文章</div>
          <div class="top-actions">
            <span class="conn" id="conn">连接中…</span>
            <button class="btn ghost small" id="refresh-btn" type="button">刷新</button>
          </div>
        </header>
        <div class="view" id="view">
          <div class="loading">正在加载…</div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>
    <dialog class="dialog" id="dialog">
      <div class="dialog-head">
        <h2 id="dialog-title">提示</h2>
        <button class="icon-btn" id="dialog-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="dialog-body" id="dialog-body"></div>
    </dialog>
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden />
    <input type="file" id="multi-file-input" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden multiple />

    <script type="module" src="/admin.js"></script>
  </body>
</html>
